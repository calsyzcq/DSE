<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSE 學習資源網</title>
  <style>
    /* 基本版面與字體設定 */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f7f6;
      color: #333;
      line-height: 1.6;
    }

    /* 頂部標題區塊 */
    header {
      background-color: #2c3e50;
      color: #ffffff;
      padding: 3rem 1rem;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 2.2rem;
    }
    header p {
      margin-top: 0.5rem;
      font-size: 1.1rem;
      color: #bdc3c7;
    }

    /* 主要內容容器 */
    .container {
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    /* 白色卡片區塊 */
    .card {
      background: #ffffff;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    }
    .card h2 {
      margin-top: 0;
      color: #2980b9;
      border-bottom: 2px solid #ecf0f1;
      padding-bottom: 0.5rem;
    }

    /* 按鈕樣式 */
    .btn {
      display: inline-block;
      background-color: #3498db;
      color: #ffffff;
      padding: 0.6rem 1.2rem;
      text-decoration: none;
      border-radius: 5px;
      margin-top: 0.5rem;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #2980b9;
    }

    /* 頁尾 */
    footer {
      text-align: center;
      padding: 1.5rem;
      color: #7f8c8d;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>歡迎來到我的 DSE 網站</h1>
    <p>這裡記錄了我的學習筆記、練習與專案分享</p>
  </header>

  <div class="container">
    <div class="card">
      <h2>關於這個網站</h2>
      <p>這是我透過 GitHub Pages 架設的第一個網頁！我會在這裡整理各種科目的重點與資源。</p>
    </div>

    <div class="card">
      <h2>科目分類</h2>
      <ul>
        <li><strong>中國語文</strong>：範文重點與寫作技巧</li>
        <li><strong>英國語文</strong>：常用詞彙與文法整理</li>
        <li><strong>數學科</strong>：公式表與題型練習</li>
      </ul>
      <a href="#" class="btn">查看更多筆記</a>
    </div>
  </div>

  <footer>
    &copy; 2026 calsyzcq. Hosted on GitHub Pages.
  </footer>

</body>
</html>
